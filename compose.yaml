services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env; use at least 32 characters}
      HTTP_ADDR: ":8080"
      DB_PATH: /data/threats.db
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
    volumes:
      - threat-data:/data
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s
volumes:
  threat-data:
